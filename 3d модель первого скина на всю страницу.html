<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js — Модель космонавта (.GLB)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>

  <!-- Подключение Three.js и GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="status">Загрузка 3D-модели...</div>

  <script>
    // 1. Создание пустой сцены, камеры и рендерера
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.4, 3.8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Освещение для отображения материалов .glb модели
    const ambientLight = new THREE.HemisphereLight(0xffffff, 0x334155, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(4, 6, 5);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
    backLight.position.set(-4, 3, -5);
    scene.add(backLight);

    // 3. Автоматическое преобразование ссылки github.com/.../blob/... в прямую ссылку на бинарный файл
    THREE.DefaultLoadingManager.setURLModifier((url) => {
      if (url.includes('github.com') && url.includes('/blob/')) {
        return url
          .replace('https://github.com/', 'https://raw.githubusercontent.com/')
          .replace('/blob/', '/');
      }
      return url;
    });

    // 4. Загрузка модели строго по заданному шаблону
    let loadedModel = null;
    const statusEl = document.getElementById('status');

    const loader = new THREE.GLTFLoader();
    const modelUrl = 'https://github.com/shadowRAyZEee/lunarWalker/blob/main/astronaut_lunar.glb';

    loader.load(
      modelUrl,
      (gltf) => {
        loadedModel = gltf.scene;

        // Вычисляем габариты модели и ставим её геометрический центр ровно в (0, 0, 0)
        const box = new THREE.Box3().setFromObject(loadedModel);
        const center = box.getCenter(new THREE.Vector3());
        loadedModel.position.sub(center);

        // Разворачиваем модель лицом к камере
        loadedModel.rotation.y = Math.PI;

        scene.add(loadedModel);

        statusEl.textContent = 'Модель загружена (зажмите мышь для вращения)';
        setTimeout(() => {
          statusEl.style.opacity = '0';
        }, 2500);
      },
      (xhr) => {
        if (xhr.total > 0) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          statusEl.textContent = `Загрузка модели: ${percent}%`;
        }
      },
      (error) => {
        console.error('Ошибка загрузки .glb модели:', error);
        statusEl.style.color = '#f43f5e';
        statusEl.textContent = 'Ошибка загрузки модели. Проверьте публичный доступ к репозиторию.';
      }
    );

    // 5. Вращение модели мышью и адаптация под размер окна
    let isDragging = false;
    let prevX = 0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevX = e.clientX;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !loadedModel) return;
      const deltaX = e.clientX - prevX;
      prevX = e.clientX;
      loadedModel.rotation.y += deltaX * 0.01;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. Цикл рендеринга
    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // Плавное вращение модели, пока пользователь не крутит её мышью
      if (loadedModel && !isDragging) {
        loadedModel.rotation.y += 0.5 * dt;
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
